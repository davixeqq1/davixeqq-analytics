[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-report"
version = "1.2.0"
description = "Weekly YouTube Analytics reports for Discord, with SQLite history and a local dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Davixeqq" }]
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
yt-report = "yt_report.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yt_report = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
